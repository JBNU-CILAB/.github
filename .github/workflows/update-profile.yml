name: 조직 프로필 갱신

# 홈페이지 저장소는 데이터가 바뀌어도 이 저장소에 알려줄 수 없으므로 스케줄로
# 동작한다. 하는 일이 다른 cron 두 개를 둔다.
#
#   매일   홈페이지 저장소의 YAML 로 profile/README.md 를 다시 렌더링한다.
#          GraphQL 호출이 없어 가볍고, 콘텐츠 수정이 하루 안에 반영된다.
#   매주   위와 동일 + GitHub API 로 멤버 활동을 갱신한다. 기여 수치는 멤버가
#          커밋하는 것만으로 저절로 변하므로, 매일 갱신하면 봇 커밋이 매일 쌓인다.
#
# workflow_dispatch 는 수동 실행용이며 기본적으로 전체를 갱신한다.
# 참고: GitHub 은 공개 저장소에서 60일간 활동이 없으면 예약 워크플로를
# 비활성화한다. 매주 발생하는 커밋이 이를 막아주며, 비활성화 전에 조직
# 소유자에게 메일이 발송된다.
on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST — 콘텐츠만
    - cron: '30 21 * * 0'  # 매주 월 06:30 KST — 콘텐츠 + 멤버 활동
  workflow_dispatch:
    inputs:
      refresh_activity:
        description: 멤버 활동도 GitHub API 로 갱신할지 여부
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: profile/README.md 생성
        env:
          # 저장소 범위 토큰이라 비공개 저장소를 읽을 수 없다. 멤버 활동을
          # 공개 기여로만 한정하려는 의도와 정확히 맞는다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_REFRESH: ${{ inputs.refresh_activity }}
        run: |
          set -euo pipefail
          WEEKLY_CRON='30 21 * * 0'
          case "$EVENT_NAME" in
            schedule)
              if [ "$SCHEDULE" = "$WEEKLY_CRON" ]; then
                REFRESH_ACTIVITY=true
              else
                REFRESH_ACTIVITY=false
              fi
              ;;
            workflow_dispatch)
              REFRESH_ACTIVITY="${INPUT_REFRESH:-true}"
              ;;
            *)
              REFRESH_ACTIVITY=true
              ;;
          esac
          echo "refresh_activity=$REFRESH_ACTIVITY"
          REFRESH_ACTIVITY="$REFRESH_ACTIVITY" python scripts/build_profile.py

      - name: 변경된 경우에만 커밋
        run: |
          set -euo pipefail
          TARGETS='profile/README.md data/activity-cache.json'
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo '변경 사항 없음 — 커밋하지 않습니다.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $TARGETS
          git commit -m 'chore: 홈페이지 데이터로 조직 프로필 갱신'
          git push
