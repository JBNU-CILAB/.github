name: Update organization profile

# 자동 생성되는 부분은 멤버 활동 섹션 하나뿐이므로 트리거도 셋만 둔다.
#
#   push     템플릿이나 렌더러가 바뀌면 즉시 다시 렌더링한다. 활동은 캐시를
#            그대로 쓴다. 봇이 쓰는 파일(profile/README.md, data/) 은 경로
#            필터에 없고, GITHUB_TOKEN 으로 만든 푸시는 애초에 워크플로를
#            트리거하지 않으므로 자기 자신을 다시 부르지 않는다.
#   schedule 주 1회 멤버 활동을 갱신한다. 기여 수치는 멤버가 커밋하는 것만으로
#            저절로 변하므로, 더 자주 돌리면 의미 없는 봇 커밋이 쌓인다.
#   수동     workflow_dispatch. 기본적으로 활동까지 갱신한다.
#
# 참고: GitHub 은 공개 저장소에서 60일간 저장소 활동이 없으면 예약 워크플로를
# 비활성화한다. 방학처럼 기여가 없는 기간이 길어지면 봇 커밋도 발생하지 않으므로
# 해당될 수 있다. 비활성화 전에 조직 소유자에게 메일이 발송되며, 아무 커밋이나
# 수동 실행으로 다시 살릴 수 있다.
on:
  push:
    branches: [main]
    paths:
      - 'profile/README.template.md'
      - 'scripts/build_profile.py'
      - '.github/workflows/update-profile.yml'
  schedule:
    - cron: '30 21 * * 0'  # 매주 월 06:30 KST — 멤버 활동 갱신
  workflow_dispatch:
    inputs:
      refresh_activity:
        description: Also refresh member activity from the GitHub API
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Render profile/README.md
        env:
          # 저장소 범위 토큰이라 비공개 저장소를 읽을 수 없다. 멤버 활동을
          # 공개 기여로만 한정하려는 의도와 정확히 맞는다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REFRESH: ${{ inputs.refresh_activity }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)              REFRESH_ACTIVITY=false ;;
            schedule)          REFRESH_ACTIVITY=true ;;
            workflow_dispatch) REFRESH_ACTIVITY="${INPUT_REFRESH:-true}" ;;
            *)                 REFRESH_ACTIVITY=true ;;
          esac
          echo "refresh_activity=$REFRESH_ACTIVITY"
          REFRESH_ACTIVITY="$REFRESH_ACTIVITY" python scripts/build_profile.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          TARGETS='profile/README.md data/activity-cache.json'
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo 'Nothing changed; not committing.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $TARGETS
          git commit -m 'chore: refresh org profile from site data'
          git push
